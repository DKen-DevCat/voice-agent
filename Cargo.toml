[package]
name = "voice-agent"
version = "0.1.0"
edition = "2024"
description = "A voice-only companion agent: talk to it, and it works through Claude Code in shells nobody sees."

[[bin]]
name = "voice-agent"
path = "src/main.rs"

# The same crates (and versions) as ~/edex-rs, nothing more
[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
libc = "0.2.190"
nix = { version = "0.31.3", features = ["term", "process", "signal", "fs"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
sysinfo = "0.39.6"
tiny_http = "0.12.0"
unicode-width = "0.2.2"
ureq = "3.4.2"
vt100 = "0.16.2"
